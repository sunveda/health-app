name: Native CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Validate shared contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate JSON schemas and repository whitespace
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          for directory in ("packages/contracts", "packages/domain"):
              for path in Path(directory).rglob("*.json"):
                  json.loads(path.read_text(encoding="utf-8"))
                  print(f"Validated {path}")
          PY
          git diff --check

      - name: Reject forbidden patterns
        shell: bash
        run: python3 scripts/check-forbidden-patterns.py

      - name: Run domain eligibility tests
        shell: bash
        run: python3 -m unittest discover -s packages/domain -t packages/domain -p 'test_*.py'

      - name: Test iOS simulator destination resolver
        shell: bash
        run: python3 -m unittest discover -s scripts -t scripts -p 'test_ios_simulator_destination.py'

  android:
    name: Android build and test
    runs-on: ubuntu-latest
    needs: contracts
    defaults:
      run:
        working-directory: apps/android
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: "8.10"

      - name: Build and test Android app
        run: gradle --no-daemon test assembleDebug

  ios:
    name: iOS build and test
    runs-on: macos-14
    needs: contracts
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up XcodeGen
        shell: bash
        run: brew install xcodegen

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml
          # XcodeGen currently emits project format 77; macos-14 ships Xcode 15.
          sed -i '' 's/objectVersion = 77;/objectVersion = 56;/' HealthApp.xcodeproj/project.pbxproj

      - name: Build and test iOS app
        shell: bash
        run: |
          set -euo pipefail
          # Prefer iPhone 15; fall back to another available iPhone by UDID.
          # Do not use generic/platform=iOS Simulator — that cannot run tests.
          DESTINATION="$(python3 ../../scripts/ios_simulator_destination.py)"
          echo "Using xcodebuild destination: ${DESTINATION}"
          xcodebuild \
            -project HealthApp.xcodeproj \
            -scheme HealthApp \
            -sdk iphonesimulator \
            -destination "${DESTINATION}" \
            CODE_SIGNING_ALLOWED=NO \
            test
