name: HealthApp
options:
  bundleIdPrefix: com.sunveda
  xcodeVersion: "15.0"
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 5.9
targets:
  HealthApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HealthApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sunveda.healthapp
        INFOPLIST_KEY_CFBundleDisplayName: My Health
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        SWIFT_EMIT_LOC_STRINGS: YES
    scheme:
      testTargets: []
