name: HealthApp
options:
  bundleIdPrefix: com.sunveda
  xcodeVersion: "15.0"
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 5.9
targets:
  HealthApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HealthApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sunveda.healthapp
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: My Health
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        SWIFT_EMIT_LOC_STRINGS: YES
  HealthAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HealthAppTests
    dependencies:
      - target: HealthApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sunveda.healthapp.tests
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        GENERATE_INFOPLIST_FILE: YES

schemes:
  HealthApp:
    build:
      targets:
        HealthApp: all
        HealthAppTests: [test]
    test:
      targets:
        - HealthAppTests
